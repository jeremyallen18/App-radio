name: doliv_social
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter


  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.2

  http: ^1.1.0
  multi_select_flutter: ^4.1.3
  table_calendar: ^3.0.9
  # Descargar y compartir el reporte de asistencia (CSV/PDF) generado por el
  # backend: se guarda en un archivo temporal (path_provider) y se ofrece por
  # la hoja de compartir del sistema (share_plus).
  path_provider: ^2.1.5
  share_plus: ^13.3.0
  # Mapa interactivo para elegir la ubicación de un evento del calendario
  # (lib/shared/calendar/location_picker_map.dart). Usa teselas de
  # OpenStreetMap (sin API key); requiere internet solo para cargar el mapa.
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  flutter_secure_storage: ^10.3.1
  local_auth: ^2.3.0
  fl_chart: ^1.2.0
  shared_preferences: ^2.2.2
  # Formateo de fechas/números localizado (es_MX) — lib/shared/resources/doc.dart.
  intl: ^0.20.2

  # Reproductor de la radio en vivo (lib/core/audio/radio_player.dart). Se usa
  # just_audio (no audioplayers) para la transmisión en vivo porque su
  # motor en Android (ExoPlayer) sí entiende el protocolo ICY/Icecast que
  # manda el stream de Zeno.fm; el MediaPlayer nativo que usa audioplayers
  # lo rechaza con MEDIA_ERROR_UNKNOWN.
  # Usado directamente en radio_player.dart para el `MediaItem` de los
  # metadatos de la notificación (dependencia transitiva de
  # just_audio_background, pero se declara explícita porque se importa).
  audio_service: ^0.18.15
  just_audio: ^0.9.40
  # Complemento de just_audio: mantiene la radio sonando en segundo plano
  # (app minimizada / pantalla bloqueada) usando un foreground service en
  # Android con controles en la notificación y en la pantalla de bloqueo.
  just_audio_background: ^0.0.1-beta.13
  # just_audio no trae implementación nativa para Windows/Linux (solo
  # Android/iOS/macOS/Web). just_audio_media_kit le agrega esas dos
  # plataformas por debajo usando media_kit (libmpv), sin tocar el código
  # que ya usa la API de just_audio (radio_player.dart no cambia).
  just_audio_media_kit: ^2.1.0
  media_kit_libs_windows_audio: any
  media_kit_libs_linux: any
  # webview_flutter_plus: ^0.3.0+2
  image_picker: ^1.2.3
  geolocator: ^14.0.3



dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

dependency_overrides:
  # image_picker_android still caps this below 2.0.35, but 2.0.17 calls a
  # v1-embedding API (PluginRegistry.Registrar) removed from the current
  # Flutter engine, which fails the Android build.
  flutter_plugin_android_lifecycle: ^2.0.35
  # image_picker_android 0.8.13+ ships a build.gradle.kts that conflicts
  # with this project's Groovy-based Gradle setup (Kotlin compilerOptions
  # DSL mismatch). 0.8.12+25 still uses the classic build.gradle and
  # already targets Android v2 embedding, so it avoids both issues.
  image_picker_android: 0.8.12+25
  # Same issue as image_picker_android above: 2.4.22+ switched to
  # build.gradle.kts with the conflicting Kotlin compilerOptions DSL.
  # 2.4.21 is the last version using the classic build.gradle.
  shared_preferences_android: 2.4.21

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - lib/assets/
    - assets/logo/
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/logo/logo.png"
  windows:
    generate: true
    image_path: "assets/logo/logo.png"
  macos:
    generate: true
    image_path: "assets/logo/logo.png"
