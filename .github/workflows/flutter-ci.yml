name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Build de producción: no se dispara solo, hay que lanzarlo a mano desde
  # la pestaña "Actions" de GitHub cuando ya se quiera migrar a doliv.site.
  workflow_dispatch:
    inputs:
      base_url:
        description: 'BASE_URL del backend (hive-backend)'
        required: false
        default: 'https://doliv.site/hive-backend'
      site_base_url:
        description: 'SITE_BASE_URL del sitio público'
        required: false
        default: 'https://doliv.site/'

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # El repo arrastra ~150 lints de estilo (info/warning) preexistentes;
      # el CI solo debe bloquear sobre errores reales de análisis.
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - run: flutter test

  # Solo corre cuando se dispara manualmente (ver workflow_dispatch arriba).
  # Hoy firma el APK/AAB con la keystore de debug de Flutter porque el
  # proyecto todavía no tiene signingConfig de release — sirve para validar
  # que el build de producción compila contra doliv.site, NO para subir a
  # las tiendas tal cual. Antes del primer release real hay que:
  #   1) generar una keystore de release y un key.properties (fuera de git),
  #   2) configurar signingConfigs.release en android/app/build.gradle,
  #   3) agregar esa keystore como secret de este repo y firmarla aquí.
  build-release:
    if: github.event_name == 'workflow_dispatch'
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build APK (release, sin firma de tienda)
        run: |
          flutter build apk --release \
            --dart-define=BASE_URL=${{ inputs.base_url }} \
            --dart-define=SITE_BASE_URL=${{ inputs.site_base_url }}

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
